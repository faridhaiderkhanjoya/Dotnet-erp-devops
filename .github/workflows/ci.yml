name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MuhuddinTradder/MuhuddinTradder.sln

      - name: Build application
        run: dotnet build MuhuddinTradder/MuhuddinTradder.sln --configuration Release --no-restore

      - name: Build Docker image
        run: docker build -t dotnet-erp-devops:ci ./MuhuddinTradder/MuhuddinTradder

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: docker tag dotnet-erp-devops:ci ghcr.io/${{ github.repository_owner }}/dotnet-erp-devops:latest

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/dotnet-erp-devops:latest
