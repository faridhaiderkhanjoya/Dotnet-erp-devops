name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MuhuddinTradder/MuhuddinTradder.sln

      - name: Build application
        run: dotnet build MuhuddinTradder/MuhuddinTradder.sln --configuration Release --no-restore
